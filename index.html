// したじレイヤ（てんせん・はせん・くさりせんのときだけひょうじ）
let baseLayer = null;

function renderMap(features) {
  if (geojsonLayer) map.removeLayer(geojsonLayer);
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }

  const dashArray = LINE_STYLES[currentLineStyle].dashArray;
  const needBase = currentLineStyle !== 'solid';

  const filteredFeatures = { type: 'FeatureCollection', features: features.filter(f => f.geometry) };

  // したじのじっせん（しろ）をさきにひく
  if (needBase) {
    baseLayer = L.geoJSON(filteredFeatures, {
      style: f => ({
        color: '#ffffff',
        weight: 5,
        opacity: 1.0,
        dashArray: null
      }),
      interactive: false
    }).addTo(map);
  }

  // idをキにしたMapをつくってhover/clickをはやくする
  const layerMap = {};

  // うえにてんせん・はせん・くさりせんをかさねる
  geojsonLayer = L.geoJSON(filteredFeatures, {
    style: f => ({
      color: getBorderColor(f.properties.id, f.properties.type),
      weight: 2.5,
      opacity: 0.85,
      dashArray: dashArray
    }),
    onEachFeature: (f, layer) => {
      layerMap[f.properties.id] = layer;
      let clickTimer = null;
      layer.on('click', (e) => {
        clickTimer = setTimeout(() => selectBorder(f.properties.id), 250);
      });
      layer.on('dblclick', (e) => {
        clearTimeout(clickTimer);
        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e);
        if (!editMode) return;
        if (selectedId !== f.properties.id) {
          selectBorder(f.properties.id, true);
          return;
        }
        const posM = calcPosMFromLatLng(f.properties.id, e.latlng.lat, e.latlng.lng);
        openAddModal(posM, e.latlng.lat, e.latlng.lng);
      });
      layer.on('mouseover', () => layer.setStyle({ weight: 5, opacity: 1 }));
      layer.on('mouseout', () => {
        if (selectedId !== f.properties.id) layer.setStyle({ weight: 2.5, opacity: 0.85, dashArray });
      });
    }
  }).addTo(map);

  // ちずのどこでもダブルクリックでへんしゅうモーダル（へんしゅうモードONのとき）
  map.on('dblclick', (e) => {
    if (!editMode || !selectedId) return;
    L.DomEvent.stopPropagation(e);
    L.DomEvent.preventDefault(e);
    const posM = calcPosMFromLatLng(selectedId, e.latlng.lat, e.latlng.lng);
    openAddModal(posM, e.latlng.lat, e.latlng.lng);
  });

}

    <h3>${p.pref1} × ${p.pref2}</h3>
    <div class="detail-row"><span class="detail-label">番号</span><span class="detail-value">${p.id}</span></div>
    <div class="detail-row"><span class="detail-label">長さ</span><span class="detail-value">${p.length_km > 0 ? p.length_km.toFixed(3) + ' km' : '0 km'}</span></div>
    <div class="detail-row"><span class="detail-label">参考長さ</span><span class="detail-value">${p.ref_km != null ? p.ref_km + ' km' : 'なし'}</span></div>
    <div class="detail-row"><span class="detail-label">種別</span><span class="detail-value">${TYPE_LABELS[p.type]||p.type}</span></div>
    ${p.note ? `<div class="detail-row"><span class="detail-label">備考</span><span class="detail-value">${p.note}</span></div>` : ''}
  `;

  // 地図移動
  if (!skipFitBounds) {
    if (f.geometry) {
      try { map.fitBounds(L.geoJSON(f).getBounds(), { padding: [40, 40] }); } catch(e) {}
    } else {
      const loc = ZERO_KM_LOCATIONS[id];
      if (loc) {
        map.setView([loc.lat, loc.lng], loc.zoom);
        L.popup()
          .setLatLng([loc.lat, loc.lng])
          .setContent(`<b>${p.pref1} × ${p.pref2}</b><br>${loc.label}`)
          .openOn(map);
      }
    }
  }

  // ヘッダーのカラーピッカーを現在の色に同期
  const picker = document.getElementById('header-color-picker');
  if (picker) picker.value = currentColor;
  document.querySelectorAll('.palette-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.title === currentColor);
  });

  renderMuni(id);
  if (!muniVisible) renderLabelOnly(id);
  renderMarkers(id);
  if (peaksVisible) renderPeaks(id);
  if (railVisible || roadVisible || bridgeVisible || tunnelVisible || riverVisible || lakeVisible || damVisible || heritageVisible) renderAllIcons(id);
  consolidateIcons();
  renderEditItems(id);

  // タイムラン・しゅるいべつはmuniVisibleによらずひょうじ
  const colorMap = {};
  const p1c = {}, p2c = {};
  const lengths = muniLengths[String(id)] || [];
  lengths.forEach(m => {
    const key = m.pref + '_' + m.name;
    if (m.side === 'pref1') {
      if (!(key in p1c)) p1c[key] = Object.keys(p1c).length;
      colorMap[key] = getMuniColor('pref1', p1c[key]);
    } else {
      if (!(key in p2c)) p2c[key] = Object.keys(p2c).length;
      colorMap[key] = getMuniColor('pref2', p2c[key]);
    }
  });
  renderTimeline(id, f, colorMap);
  renderCategory(id, f, colorMap);

  geojsonLayer.eachLayer(layer => {
    if (layer.feature && layer.feature.properties.id === id) {
      layer.setStyle({ weight: 5, opacity: 1, color: getBorderColor(id, p.type), dashArray: LINE_STYLES[currentLineStyle].dashArray });
    } else {
      const lp = layer.feature.properties;
      layer.setStyle({ weight: 2.5, opacity: 0.85, color: getBorderColor(lp.id, lp.type), dashArray: LINE_STYLES[currentLineStyle].dashArray });
    }
  });
}

// ========================================
// カラー変更
// ========================================
function changeColor(id, color) {
  customColors[id] = color;
  saveColors();
  // リスト の いろまる も こうしん
  const item = document.querySelector(`.border-item[data-id="${id}"] span[style]`);
  if (item) item.style.background = color;
  // ちず も こうしん
  geojsonLayer.eachLayer(layer => {
    if (layer.feature && layer.feature.properties.id === id) {
      layer.setStyle({ color });
    }
  });
}

// ========================================
// パレット色
// ========================================
const PALETTE_COLORS = [
  '#5b9cf6','#e07070','#d4a840','#60c8a0','#f08040',
  '#70d0e0','#a0e060','#e060a0','#ffffff','#000000',
  '#dc143c','#00008b','#666666','#cccccc'
];

function initPalette() {
  const wrap = document.getElementById('palette-swatches');
  if (!wrap) return;
  wrap.style.display = 'flex';
  wrap.style.gap = '3px';
  PALETTE_COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'palette-swatch';
    sw.style.background = c;
    sw.title = c;
    sw.onclick = () => changeColorFromHeader(c);
    wrap.appendChild(sw);
  });
}
initPalette();

function changeColorFromHeader(color) {
  if (selectedId === null) return;
  const f = allFeatures.find(f => f.properties.id === selectedId);
  if (!f) return;
  changeColor(selectedId, color);
  // ピッカーの色も同期
  const picker = document.getElementById('header-color-picker');
  if (picker) picker.value = color;
  // パレットのアクティブ表示
  document.querySelectorAll('.palette-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.style.background === hexToRgb(color) || sw.title === color);
  });
}

function resetColorFromHeader() {
  if (selectedId === null) return;
  const f = allFeatures.find(f => f.properties.id === selectedId);
  if (!f) return;
  const defaultColor = TYPE_COLORS[f.properties.type] || '#5b9cf6';
  delete customColors[selectedId];
  saveColors();
  changeColor(selectedId, defaultColor);
  const picker = document.getElementById('header-color-picker');
  if (picker) picker.value = defaultColor;
  document.querySelectorAll('.palette-swatch').forEach(sw => sw.classList.remove('active'));
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function resetColor(id, defaultColor) {
  delete customColors[id];
  saveColors();
  changeColor(id, defaultColor);
}

function resetAllColors() {
  customColors = {};
  saveColors();
  renderMap(allFeatures);
  renderList(allFeatures);
  // いま えらんでる けんきょう の ピッカー も リセット
  if (selectedId !== null) {
    const f = allFeatures.find(f => f.properties.id === selectedId);
    if (f) {
      const defaultColor = TYPE_COLORS[f.properties.type] || '#5b9cf6';
      const picker = document.getElementById('header-color-picker');
      if (picker) picker.value = defaultColor;
    }
  }
}
// ========================================
// スプリッター
// ========================================
const splitter = document.getElementById('splitter');
const borderList = document.getElementById('border-list');
const detailPanel = document.getElementById('detail-panel');
const sidebar = document.getElementById('sidebar');

splitter.addEventListener('mousedown', e => {
  e.preventDefault();
  const startY = e.clientY;
  const startListH = borderList.getBoundingClientRect().height;
  const startDetailH = detailPanel.getBoundingClientRect().height;
  const total = startListH + startDetailH;

  const onMove = e => {
    const dy = e.clientY - startY;
    const newListH = Math.max(60, Math.min(total - 60, startListH + dy));
    const newDetailH = total - newListH;
    borderList.style.flex = 'none';
    borderList.style.height = newListH + 'px';
    detailPanel.style.height = newDetailH + 'px';
  };

  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
</script>
